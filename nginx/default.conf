# Cache strategy: hashed Astro assets are immutable, everything else
# (HTML, favicon, robots, healthz) must revalidate.
map $uri $cache_control {
    default        "no-cache";
    ~^/_astro/     "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text-ish responses.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers (declared at server level so every response gets them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $cache_control always;

    location / {
        try_files $uri $uri/ =404;
    }
}
