services:
  portal:
    # Registry image for the public host (`docker compose pull`); `build` keeps
    # local dev working via `docker compose up --build`.
    image: ghcr.io/brocahontaz/portal:latest
    build: .
    container_name: portal
    ports:
      - "${PORT:-8080}:8080"
    # Runtime services config (see README "Docker"): when set to the path of a
    # JSON file mounted into the container, the entrypoint re-renders the site
    # from it at container start. The `:-` empty default arrives set-but-empty
    # — safe: the entrypoint treats that like unset and serves the baked-in
    # services.
    environment:
      PORTAL_SERVICES_PATH: "${PORTAL_SERVICES_PATH:-}"
    restart: unless-stopped
